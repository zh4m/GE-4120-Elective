<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="GE 4120 Portfolio by Zhameer Usman A. Abas IV">
  <style>
    @font-face{font-family:'Bebas';src:url(data:font/woff;base64,) format('woff');}
    .t { font-family:'Bebas','Bebas Neue','Arial Narrow',Impact,sans-serif; }
    .bar { transform-origin: 72px 0; animation: grow 1.1s .3s cubic-bezier(.2,.8,.2,1) both; }
    .up { animation: up .8s ease-out both; }
    .up2 { animation: up .8s .15s ease-out both; }
    .up3 { animation: up .8s .3s ease-out both; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/></pattern>
    <clipPath id="c"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="420" fill="#0e1318"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <text class="t" x="1236" y="470" text-anchor="end" font-size="460" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">04</text>
  </g>

  <g class="up">
    <rect x="72" y="70" width="10" height="10" fill="#ff3131" class="blink"/>
    <text class="t" x="94" y="81" font-size="18" letter-spacing="4" fill="#67696b">21ST CENTURY IT SKILLS  /  2026</text>
  </g>
  <g class="up2">
    <text class="t" x="66" y="262" font-size="200" fill="#ffffff">GE 4120</text>
  </g>
  <rect class="bar" x="72" y="282" width="300" height="8" fill="#ff3131"/>
  <g class="up3">
    <text class="t" x="72" y="340" font-size="30" letter-spacing="1.5" fill="#ffffff">ZHAMEER USMAN A. ABAS IV</text>
    <text class="t" x="72" y="368" font-size="20" letter-spacing="3" fill="#67696b">BS NURSING  ·  ATENEO DE DAVAO UNIVERSITY</text>
  </g>
  <g class="up3">
    <text class="t" x="1128" y="340" text-anchor="end" font-size="30" letter-spacing="1.5" fill="#ffffff">04 ACTIVITIES</text>
    <text class="t" x="1128" y="368" text-anchor="end" font-size="20" letter-spacing="3" fill="#67696b">PORTFOLIO</text>
  </g>
</svg>
