<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Activity 06: One Page Website">
  <style>
    @font-face{font-family:'Bebas';src:url(data:font/woff;base64,) format('woff');}
    .t { font-family:'Bebas','Bebas Neue','Arial Narrow',Impact,sans-serif; }
    .in { animation: in .7s ease-out both; }
    .grow { transform-origin: 0 0; animation: grow 1s .2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <g class="in">
    <text class="t" x="0" y="84" font-size="96" fill="#ff3131">06</text>
    <text class="t" x="104" y="56" font-size="46" letter-spacing=".5" fill="#0e1318">ONE PAGE WEBSITE</text>
    <text class="t" x="106" y="84" font-size="20" letter-spacing="3" fill="#67696b">PC REPAIR BUSINESS SITE</text>
  </g>
  <rect x="1142.75" y="34.75" width="56.5" height="30.5" rx="15.25" fill="none" stroke="#67696b" stroke-opacity=".6" stroke-width="1.5"/><text class="t" x="1171.0" y="57" text-anchor="middle" font-size="18" letter-spacing="2" fill="#67696b">WEB</text><rect x="1074.75" y="34.75" width="56.5" height="30.5" rx="15.25" fill="none" stroke="#67696b" stroke-opacity=".6" stroke-width="1.5"/><text class="t" x="1103.0" y="57" text-anchor="middle" font-size="18" letter-spacing="2" fill="#67696b">PDF</text>
  <rect x="0" y="106" width="1200" height="1" fill="#d0d7de"/>
  <rect class="grow" x="0" y="104" width="96" height="5" fill="#ff3131"/>
</svg>
