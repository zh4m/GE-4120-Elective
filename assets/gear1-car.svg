    .wind { animation: wind 0.45s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes road { to { transform: translateX(-60px); } }
    @keyframes bob { to { transform: translateY(-1.5px); } }
    @keyframes wind { from { opacity: 0.9; } to { opacity: 0.1; } }
