<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="0.35" stop-color="#c084fc"/>
      <stop offset="0.7" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .b1 { animation: d1 9s ease-in-out infinite alternate; }
    .b2 { animation: d2 11s ease-in-out infinite alternate; }
    .b3 { animation: d3 13s ease-in-out infinite alternate; }
    .in { animation: in 1s ease-out both; }
    .in2 { animation: in 1s 0.2s ease-out both; }
    .in3 { animation: in 1s 0.4s ease-out both; }
    @keyframes d1 { to { transform: translate(-80px, 40px); } }
    @keyframes d2 { to { transform: translate(60px, -50px); } }
    @keyframes d3 { to { transform: translate(-50px, -30px); } }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="#0b0b1a"/>
    <g filter="url(#blur)" opacity="0.85">
      <circle class="b1" cx="980" cy="90" r="170" fill="#6366f1"/>
      <circle class="b2" cx="1100" cy="330" r="150" fill="#ec4899"/>
      <circle class="b3" cx="800" cy="360" r="130" fill="#f97316" opacity="0.8"/>
      <circle class="b2" cx="870" cy="200" r="110" fill="#a855f7"/>
    </g>
    <rect width="1200" height="420" fill="url(#title)" opacity="0.04"/>
  </g>

  <g class="in">
    <rect x="70" y="66" width="214" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="90" cy="82" r="5" fill="#f472b6"/>
    <text x="104" y="87" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#e5e7eb">IT SKILLS ELECTIVE</text>
  </g>
  <g class="in2">
    <text x="64" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-4" fill="url(#title)">GE 4120</text>
    <text x="70" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="300" fill="#e5e7eb">Laboratory Activities &amp; Projects</text>
  </g>
  <g class="in3">
    <text x="70" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Zhameer Usman A. Abas IV</text>
    <text x="70" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#a5a6c4">BS Nursing, 4th Year  ·  Ateneo de Davao University</text>
    <rect x="70" y="378" width="26" height="6" rx="3" fill="#6366f1"/><rect x="104" y="378" width="26" height="6" rx="3" fill="#a855f7"/><rect x="138" y="378" width="26" height="6" rx="3" fill="#ec4899"/><rect x="172" y="378" width="26" height="6" rx="3" fill="#f97316"/>
  </g>

  <g transform="translate(910,150)" class="in3">
    <rect x="0" y="0" width="200" height="120" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="28" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">4</text>
    <text x="70" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Activities</text>
    <text x="70" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d5db">Design · Branding</text>
    <text x="70" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#d1d5db">Infographic · Slides</text>
  </g>
</svg>